<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Siftory</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="topbar-mark">&#9670;</span>
      <span class="topbar-title">Siftory</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-dataset" id="activeDatasetLabel">No dataset</span>
    </div>
  </header>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-header">
          <span>Datasets</span>
          <label class="btn-icon" for="fileInput" title="Upload CSV">+</label>
        </div>
        <div class="dataset-list" id="datasetList">
          <div class="empty-state">Loading datasets...</div>
        </div>
      </div>

      <!-- Hidden file input -->
      <input type="file" id="fileInput" accept=".csv" style="display:none;">

      <!-- Upload drop zone (hidden by default) -->
      <div class="upload-zone" id="uploadZone" style="display:none;">
        <label class="upload-content" for="fileInput">
          <div class="upload-icon">&#8679;</div>
          <p>Drop CSV here or <span class="link-btn">browse</span></p>
        </label>
        <div class="upload-progress" id="uploadProgress" style="display:none;">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <span class="progress-text" id="progressText">Uploading...</span>
        </div>
      </div>

      <!-- Pipeline progress (hidden until L3+ analysis) -->
      <div class="sidebar-section" id="pipelineSection" style="display:none;">
        <div class="sidebar-header"><span>Analysis Progress</span></div>
        <div class="pipeline-stepper" id="pipelineStepper"></div>
      </div>
    </aside>

    <!-- Main workspace -->
    <main class="workspace" id="workspace">

      <!-- Welcome state -->
      <div class="welcome" id="welcomeState">
        <h1>What would you like to explore?</h1>
        <p class="welcome-sub">Upload a dataset or select the NovaMart demo to get started.</p>
        <div class="suggested-queries" id="suggestedQueries" style="display:none;">
          <button class="suggestion" data-q="What does this data look like?">What does this data look like?</button>
          <button class="suggestion" data-q="Show me revenue trends over time">Revenue trends over time</button>
          <button class="suggestion" data-q="Compare conversion rates by device type">Conversion by device</button>
          <button class="suggestion" data-q="Show me the top 10 products by total revenue">Top products by revenue</button>
        </div>
      </div>

      <!-- Results area (cards stack here) -->
      <div class="results" id="results"></div>

      <!-- Chat input -->
      <div class="chat-bar" id="chatBar">
        <div class="chat-input-wrap">
          <textarea
            id="chatInput"
            class="chat-input"
            placeholder="Ask anything about your data..."
            rows="1"
            disabled
          ></textarea>
          <button class="chat-send" id="chatSend" disabled title="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/dashboard.js"></script>
  <script src="/js/pipeline.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/upload.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
